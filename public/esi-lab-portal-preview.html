<body>
  <div id="root"></div>
  <script>
    (() => {
      const PASSWORD = "ESI@2026";
      const branches = [
        {id:"sarojini",short:"SN",name:"ESI Dispensary Sarojani Nagar, Lucknow",user:"sarojini"},
        {id:"aishbagh",short:"AB",name:"ESI Dispensary Aishbagh, Lucknow",user:"aishbagh"},
        {id:"golaganj",short:"GG",name:"ESI Dispensary Golaganj (KGMU), Lucknow",user:"golaganj"},
        {id:"sandeela",short:"SD",name:"ESI Dispensary Sandeela, Hardoi",user:"sandeela"},
        {id:"sitapur",short:"ST",name:"ESI Dispensary Sitapur",user:"sitapur"},
        {id:"barabanki",short:"BB",name:"ESI Dispensary Barabanki",user:"barabanki"},
        {id:"raebareli",short:"RB",name:"ESI Dispensary Raebareli",user:"raebareli"}
      ];
      const defaultTests = [
        {id:"blood-sugar",name:"Blood Sugar",category:"Biochemistry",rate:60,reference:"70–140 mg/dL",active:true},
        {id:"lft",name:"LFT",category:"Biochemistry",rate:250,reference:"As per laboratory range",active:true},
        {id:"cbc",name:"CBC",category:"Haematology",rate:120,reference:"As per laboratory range",active:true},
        {id:"thyroid",name:"Thyroid Profile",category:"Hormone assay",rate:300,reference:"As per laboratory range",active:true}
      ];
      const $ = (selector) => document.querySelector(selector);
      const root = $("#root");
      let session = null;
      let activeView = "dashboard";
      let reportId = null;
      let editingTestId = null;
      let memoryStore = {};
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
      const money = (value) => "₹ " + Number(value || 0).toFixed(2);
      const date = (value) => new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(value));
      const storageKey = () => "esi-lab-preview:" + session.id;
      function sampleEntry(branch, number) {
        const tests = defaultTests.slice(0, number === 1 ? 2 : 3).map((test, index) => ({...test, result:index === 0 ? "Within reference range" : "", notes:""}));
        return {id:branch.short + "-" + String(1000 + number),patient:"Sample patient " + number,registrationNumber:"REG-" + branch.short + "-" + String(1000 + number),ip:"ESI-" + (24000 + number),title:number % 2 ? "Mr" : "Ms",age:String(25 + number),sex:number % 2 ? "Male" : "Female",relationship:"Self",ipHolderName:"",tests,status:number === 1 ? "Completed" : "In progress",createdAt:Date.now() - number * 86400000};
      }
      function newData() {
        return {tests:defaultTests.map(test => ({...test})),entries:[sampleEntry(session,1),sampleEntry(session,2)],reviews:[{id:"welcome",name:"Portal reviewer",rating:5,comment:"The location-wise workflow is clear and easy to use.",createdAt:Date.now()-86400000*3}]};
      }
      function loadData() {
        try { const saved = localStorage.getItem(storageKey()); return saved ? JSON.parse(saved) : newData(); }
        catch (_) { return memoryStore[storageKey()] || newData(); }
      }
      function saveData(data) {
        try { localStorage.setItem(storageKey(), JSON.stringify(data)); } catch (_) { memoryStore[storageKey()] = data; }
      }
      function pill(status) { const className = status === "Completed" ? "completed" : status === "Collected" ? "collected" : "progress"; return '<span class="pill ' + className + '">' + esc(status) + '</span>'; }
      function toast(message) { const old = $(".toast"); if (old) old.remove(); const el = document.createElement("div"); el.className="toast"; el.textContent=message; document.body.append(el); setTimeout(() => el.remove(), 3200); }
      function loginScreen() {
        root.innerHTML = '<main class="login"><section class="login-brand"><div class="topline">● UTTAR PRADESH ESI</div><div class="seal">UP<br>ESI</div><p class="eyebrow">ESI dispensaries · Lucknow zone</p><h1>Laboratory entries,<br><em>kept private.</em></h1><p class="brand-copy">A secure portal for registering tests and issuing reports separately for every dispensary.</p><p class="security-note">Every location opens its own records, tests, reports and reviews on this browser.</p></section><section class="login-panel"><div class="login-content"><p class="eyebrow">Secure location access</p><h2>Sign in to your dispensary</h2><p class="muted">Choose a location below or enter its login ID and password.</p><form id="login-form" class="form"><label class="field">Location login ID<input class="input" id="login-user" placeholder="e.g. sarojini" autocomplete="username"></label><label class="field">Password<input class="input" id="login-password" type="password" placeholder="Enter password" autocomplete="current-password"></label><p class="error hidden" id="login-error"></p><button class="button" type="submit">Sign in →</button></form><div class="creds"><div class="creds-head"><span>7 location logins</span><b>Password: ' + PASSWORD + '</b></div><div class="credential-grid">' + branches.map(branch => '<button class="credential" type="button" data-action="fill-login" data-user="' + branch.user + '"><span>' + branch.short + '</span><strong>' + branch.user + '</strong><small>' + esc(branch.name.replace("ESI Dispensary ","")) + '</small></button>').join("") + '</div></div></div></section></main>';
      }
      function appShell(body) {
        const location = session.name;
        const navItems = [["dashboard","Dashboard"],["entry","New test entry"],["results","Result entry"],["tests","Test catalogue & rates"],["reports","Reports"],["reviews","Customer reviews"]];
        root.innerHTML = '<div class="app"><aside class="sidebar"><div class="sidebar-brand"><span class="mini-seal">ESI</span><div><strong>ESI Lab Portal</strong><small>Lucknow Zone</small></div></div><div class="location-chip"><span>Signed in location</span><strong>' + session.short + ' · ' + esc(location.replace("ESI Dispensary ","")) + '</strong></div><nav class="nav">' + navItems.map(([id,label]) => '<button data-view="' + id + '" class="' + (activeView===id?"active":"") + '">' + label + '</button>').join("") + '</nav><div class="sidebar-footer"><button data-action="logout" class="button">↪ Sign out</button></div></aside><main class="main"><header class="app-header"><div class="breadcrumb">ESI Lab Portal / <b>' + esc(viewTitle()) + '</b></div><div class="header-user"><span>' + esc(session.user) + '</span><div class="avatar">' + session.short + '</div></div></header><div class="mobile-nav">' + navItems.map(([id,label]) => '<button data-view="' + id + '" class="' + (activeView===id?"active":"") + '">' + label + '</button>').join("") + '</div>' + body + '</main></div>';
      }
      function viewTitle(){return ({dashboard:"Dashboard",entry:"New test entry",results:"Result entry",tests:"Test catalogue & rates",reports:"Reports",reviews:"Customer reviews"})[activeView];}
      function dashboard(data) {
        const completed = data.entries.filter(entry=>entry.status==="Completed").length;
        const progress = data.entries.filter(entry=>entry.status==="In progress").length;
        const collected = data.entries.filter(entry=>entry.status==="Collected").length;
        const recent = data.entries.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
        return '<section class="page"><div class="page-heading"><div><p class="eyebrow">Location dashboard</p><h1>' + esc(session.name.replace("ESI Dispensary ","")) + '</h1><p>Numbers and records for this location only.</p></div><button class="button orange" data-view="entry">+ New test entry</button></div><div class="stats"><div class="stat orange"><div class="icon">#</div><strong>' + data.entries.length + '</strong><span>Total tests registered</span></div><div class="stat green"><div class="icon">✓</div><strong>' + completed + '</strong><span>Completed reports</span></div><div class="stat blue"><div class="icon">◷</div><strong>' + progress + '</strong><span>Results in progress</span></div><div class="stat gold"><div class="icon">★</div><strong>' + data.reviews.length + '</strong><span>Customer reviews</span></div></div><div class="grid-2"><section class="panel"><div class="panel-head"><div><h2>Recent test entries</h2><p>The latest registrations for ' + esc(session.short) + '.</p></div><button class="button light" data-view="reports">View reports</button></div><div class="activity">' + (recent.length ? recent.map(entry=>'<div class="activity-row"><div><strong>' + esc(entry.patient) + '</strong><small>' + esc(entry.id) + ' · ' + date(entry.createdAt) + '</small></div>' + pill(entry.status) + '</div>').join("") : '<div class="empty">No entries have been added yet.</div>') + '</div></section><section class="panel"><div class="panel-head"><div><h2>Location security</h2><p>Browser-only preview storage</p></div></div><div class="note"><strong>Separate location data</strong>This HTML preview stores each location’s entries separately in the browser that opens it.</div></section></div></section>';
      }
      function entryForm(data) {
        const tests = data.tests.filter(test=>test.active!==false);
        return '<section class="page"><div class="page-heading"><div><p class="eyebrow">Patient registration</p><h1>New test entry</h1><p>This entry is saved only under ' + esc(session.short) + '.</p></div></div><form id="entry-form" class="entry-layout"><section class="panel form-panel"><h2>Patient details</h2><p class="muted">Enter the IP number provided by the store employee. The registration number is assigned automatically when the patient is saved.</p><div class="form-grid"><label class="field"><span>Title</span><select id="title" name="title"><option value="Mr">Mr</option><option value="Mrs">Mrs</option><option value="Ms">Ms</option></select></label><label class="field"><span>Sex</span><select id="sex" name="sex"><option value="Male">Male</option><option value="Female">Female</option></select></label><label class="field"><span>Patient name</span><input class="input" name="patient" required maxlength="100" placeholder="Enter patient name"></label><label class="field"><span>Registration number</span><input class="input" disabled value="Assigned automatically when saved"></label><label class="field"><span>Age</span><input class="input" name="age" required type="number" min="0" max="125" placeholder="Years"></label><label class="field"><span>IP number</span><input class="input" name="ip" required maxlength="60" placeholder="Enter IP number provided by store"></label><label class="field"><span>Relationship with IP</span><select name="relationship"><option>Self</option><option>Husband</option><option>Wife</option><option>Son</option><option>Daughter</option><option>Mother</option><option>Father</option><option>Brother</option><option>Sister</option><option>Other</option></select></label><label class="field"><span>Name of IP holder / related person</span><input class="input" name="ipHolderName" maxlength="100" placeholder="Enter name, if applicable"></label></div><div class="actions"><button class="button light" type="reset">Clear</button><button class="button orange" type="submit">Save test entry</button></div></section><aside class="panel catalogue"><h3>Requested tests</h3><p>Rates are copied into this patient’s record.</p>' + (tests.length ? tests.map(test=>'<div class="test-choice"><label><input type="checkbox" name="tests" value="' + test.id + '"> ' + esc(test.name) + '</label><span class="rate">' + money(test.rate) + '</span></div>').join("") : '<div class="empty">Add tests in the catalogue first.</div>') + '</aside></form></section>';
      }
      function testsView(data) {
        const edit = editingTestId ? data.tests.find(test=>test.id===editingTestId) : null;
        return '<section class="page"><div class="page-heading"><div><p class="eyebrow">Location-only pricing</p><h1>Test catalogue & rates</h1><p>Add or edit the tests available in ' + esc(session.short) + '.</p></div></div><div class="grid-2" style="grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);margin-top:0"><section class="panel"><div class="panel-head"><div><h2>Available tests</h2><p>These tests appear in new test entries.</p></div></div><div style="overflow:auto"><table class="catalogue-table"><thead><tr><th>Test</th><th>Category</th><th>Rate</th><th>Reference</th><th></th></tr></thead><tbody>' + (data.tests.length ? data.tests.map(test=>'<tr><td><strong>' + esc(test.name) + '</strong></td><td>' + esc(test.category) + '</td><td class="rate">' + money(test.rate) + '</td><td>' + esc(test.reference) + '</td><td><div class="row-buttons"><button class="table-action" data-action="edit-test" data-id="' + test.id + '">Edit</button><button class="table-action" data-action="delete-test" data-id="' + test.id + '">Remove</button></div></td></tr>').join("") : '<tr><td colspan="5" class="empty">No tests added.</td></tr>') + '</tbody></table></div></section><section class="panel form-panel"><h2>' + (edit ? "Edit test" : "Add a new test") + '</h2><p class="muted">Set the rate and reference range for this location.</p><form id="test-form" class="form"><input type="hidden" name="id" value="' + esc(edit?.id || "") + '"><label class="field"><span>Test name</span><input class="input" name="name" required value="' + esc(edit?.name || "") + '" placeholder="e.g. Vitamin D"></label><label class="field"><span>Category</span><input class="input" name="category" required value="' + esc(edit?.category || "") + '" placeholder="e.g. Biochemistry"></label><label class="field"><span>Rate (₹)</span><input class="input" name="rate" required type="number" min="0" step="0.01" value="' + esc(edit?.rate || "") + '" placeholder="0.00"></label><label class="field"><span>Reference range</span><input class="input" name="reference" value="' + esc(edit?.reference || "") + '" placeholder="e.g. 30–100 ng/mL"></label><div class="actions">' + (edit ? '<button class="button light" type="button" data-action="cancel-edit">Cancel</button>' : '') + '<button class="button orange" type="submit">' + (edit ? "Save changes" : "Add test") + '</button></div></form></section></div></section>';
      }
      function resultsView(data) {
        const entries = (reportId ? data.entries.filter(entry=>entry.id===reportId) : data.entries).slice().sort((a,b)=>b.createdAt-a.createdAt);
        return '<section class="page"><div class="page-heading"><div><p class="eyebrow">Laboratory verification</p><h1>Result entry</h1><p>Enter results only for patients registered at ' + esc(session.short) + '.</p></div></div>' + (entries.length ? '<form id="result-form">' + entries.map(entry=>'<section class="panel result-card"><h3>' + esc(entry.patient) + ' <span style="font-weight:400;color:#76848b">· ' + esc(entry.id) + '</span></h3><p>' + esc(entry.registrationNumber) + ' · ' + esc(entry.ip) + ' · ' + esc(entry.age) + ' years · ' + esc(entry.sex) + '</p><div class="result-tests">' + entry.tests.map(test=>'<div class="result-test"><div><strong>' + esc(test.name) + '</strong><small>' + esc(test.reference || "Reference as per laboratory") + '</small></div><input class="input" data-result-entry="' + entry.id + '" data-test-id="' + test.id + '" value="' + esc(test.result || "") + '" placeholder="Enter result / observation"><select data-status-entry="' + entry.id + '"><option value="In progress" ' + (entry.status==="In progress"?"selected":"") + '>In progress</option><option value="Collected" ' + (entry.status==="Collected"?"selected":"") + '>Collected</option><option value="Completed" ' + (entry.status==="Completed"?"selected":"") + '>Completed</option></select></div>').join("") + '</div></section>').join("") + '<div class="actions"><button class="button orange" type="submit">Save entered results</button></div></form>' : '<section class="panel empty">Create a test entry before adding results.</section>') + '</section>';
      }
      function reportMarkup(entry) {
        return '<section class="report-page"><div class="report-brand"><span class="mini-seal">ESI</span><div><strong>ESIC DISPENSARIES, LUCKNOW ZONE</strong><span>' + esc(session.name) + '</span></div></div><div class="report-title">LABORATORY INVESTIGATION REPORT</div><div class="patient-grid"><div><span>Patient name</span><strong>' + esc(entry.patient) + '</strong></div><div><span>Registration number</span><strong>' + esc(entry.registrationNumber) + '</strong></div><div><span>Age / Sex</span><strong>' + esc(entry.age) + ' / ' + esc(entry.sex) + '</strong></div><div><span>IP number</span><strong>' + esc(entry.ip) + '</strong></div><div><span>Relationship with IP</span><strong>' + esc(entry.relationship) + '</strong></div><div><span>IP holder / related person</span><strong>' + esc(entry.ipHolderName || "—") + '</strong></div></div><table class="result-table"><thead><tr><th>Investigation</th><th>Result / observation</th><th>Reference range</th></tr></thead><tbody>' + entry.tests.map(test=>'<tr><td><strong>' + esc(test.name) + '</strong></td><td>' + esc(test.result || "Awaiting laboratory verification") + '</td><td>' + esc(test.reference || "—") + '</td></tr>').join("") + '</tbody></table><div class="signature"><div><span></span><strong>Signature of Lab Technician</strong></div><div><span></span><strong>Signature of MOI / CMO</strong></div></div><p class="report-foot">Clinical values and authorisation must be validated by the authorised laboratory before issue.</p></section>';
      }
      function reportsView(data) {
        const entries = data.entries.slice().sort((a,b)=>b.createdAt-a.createdAt);
        const selected = entries.find(entry=>entry.id===reportId) || entries[0];
        return '<section class="page"><div class="page-heading no-print"><div><p class="eyebrow">Location reports</p><h1>Reports</h1><p>Select a report below to view it, edit its result values, or print only that report.</p></div></div><section class="panel reports-list no-print"><div class="panel-head"><div><h2>Select a report</h2><p>Choose View report to open the selected patient report.</p></div></div><div style="overflow:auto"><table class="report-table"><thead><tr><th>Report no.</th><th>Patient</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + (entries.length ? entries.map(entry=>'<tr style="' + (selected && selected.id===entry.id ? 'background:#fff7f1;' : '') + '"><td><strong>' + esc(entry.id) + '</strong><br><small>' + date(entry.createdAt) + '</small></td><td><strong>' + esc(entry.patient) + '</strong><br><small>' + esc(entry.registrationNumber) + ' · ' + esc(entry.ip) + ' · ' + esc(entry.age) + ' yrs</small></td><td>' + pill(entry.status) + '</td><td><div class="row-buttons"><button class="table-action" data-action="view-report" data-id="' + entry.id + '">View report</button><button class="table-action" data-action="edit-report" data-id="' + entry.id + '">Edit results</button></div></td></tr>').join("") : '<tr><td colspan="4" class="empty">No reports are available yet.</td></tr>') + '</tbody></table></div></section>' + (selected ? '<div style="margin-top:22px"><div class="panel-head no-print" style="padding:0 0 14px"><div><p class="eyebrow">Selected report</p><h2>' + esc(selected.id) + '</h2></div><div class="row-buttons"><button class="button light" data-action="edit-report" data-id="' + selected.id + '">Edit results</button><button class="button orange" data-action="print-report">Print selected report</button></div></div>' + reportMarkup(selected) + '</div>' : '') + '</section>';
      }
      function reviewsView(data) {
        return '<section class="page"><div class="page-heading"><div><p class="eyebrow">Location feedback</p><h1>Customer reviews</h1><p>Reviews belong to ' + esc(session.short) + ' only.</p></div></div><div class="grid-2" style="margin-top:0"><section class="panel form-panel"><h2>Add a review</h2><p class="muted">Capture customer feedback for this location.</p><form id="review-form" class="form"><label class="field"><span>Reviewer name</span><input class="input" name="name" required maxlength="80" placeholder="Enter name"></label><label class="field"><span>Rating</span><select name="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Needs improvement</option><option value="1">1 — Poor</option></select></label><label class="field"><span>Review</span><textarea name="comment" required maxlength="500" placeholder="Write feedback"></textarea></label><div class="actions"><button class="button orange" type="submit">Save review</button></div></form></section><section><div class="reviews">' + (data.reviews.length ? data.reviews.slice().sort((a,b)=>b.createdAt-a.createdAt).map(review=>'<article class="panel review"><div class="stars">' + "★".repeat(review.rating) + "☆".repeat(5-review.rating) + '</div><h3>' + esc(review.name) + '</h3><p>' + esc(review.comment) + '</p><small>' + date(review.createdAt) + '</small></article>').join("") : '<section class="panel empty">No reviews added yet.</section>') + '</div></section></div></section>';
      }
      function render() {
        if (!session) return loginScreen();
        const data = loadData();
        const views = {dashboard,entry:entryForm,tests:testsView,results:resultsView,reports:reportsView,reviews:reviewsView};
        appShell(views[activeView](data));
      }
      function submitLogin(form) {
        const user = $("#login-user").value.trim().toLowerCase();
        const branch = branches.find(item=>item.user===user);
        if (!branch || $("#login-password").value !== PASSWORD) { const error=$("#login-error"); error.textContent="Use one of the location login IDs and the displayed password."; error.classList.remove("hidden"); return; }
        session = branch; activeView="dashboard"; reportId=null; render();
      }
      function submitEntry(form) {
        const data = loadData(); const formData = new FormData(form); const chosen = formData.getAll("tests");
        if (!chosen.length) { toast("Select at least one requested test."); return; }
        const tests = data.tests.filter(test=>chosen.includes(test.id)).map(test=>({...test,result:"",notes:""}));
        const now = Date.now();
        const registrationNumber = "REG-" + session.short + "-" + String(data.entries.length + 1).padStart(6, "0");
        data.entries.unshift({id:session.short + "-" + String(now).slice(-6),patient:formData.get("patient").trim(),registrationNumber,ip:formData.get("ip").trim(),title:formData.get("title"),age:formData.get("age"),sex:formData.get("sex"),relationship:formData.get("relationship"),ipHolderName:formData.get("ipHolderName").trim(),tests,status:"Collected",createdAt:now});
        saveData(data); activeView="reports"; reportId=data.entries[0].id; render(); toast("Patient registered. Registration number: " + registrationNumber + ".");
      }
      function submitTest(form) {
        const data=loadData(), f=new FormData(form), id=f.get("id") || ("test-" + Date.now());
        const test={id,name:f.get("name").trim(),category:f.get("category").trim(),rate:Number(f.get("rate")),reference:f.get("reference").trim(),active:true};
        const index=data.tests.findIndex(item=>item.id===id); if(index>=0)data.tests[index]=test;else data.tests.push(test);
        saveData(data); editingTestId=null; render(); toast(index>=0?"Test updated.":"Test added.");
      }
      function submitResults() {
        const data=loadData(); data.entries.forEach(entry=>{ let selectedStatus=document.querySelector('[data-status-entry="' + CSS.escape(entry.id) + '"]'); if(selectedStatus) entry.status=selectedStatus.value; entry.tests.forEach(test=>{const input=document.querySelector('[data-result-entry="' + CSS.escape(entry.id) + '"][data-test-id="' + CSS.escape(test.id) + '"]');if(input)test.result=input.value.trim();});}); saveData(data); render(); toast("Results saved for " + session.short + ".");
      }
      function submitReview(form) {
        const data=loadData(), f=new FormData(form); data.reviews.unshift({id:"review-"+Date.now(),name:f.get("name").trim(),rating:Number(f.get("rating")),comment:f.get("comment").trim(),createdAt:Date.now()}); saveData(data); render(); toast("Review saved.");
      }
      document.addEventListener("submit", event => { const form=event.target; if(form.id==="login-form"){event.preventDefault();submitLogin(form)} if(form.id==="entry-form"){event.preventDefault();submitEntry(form)} if(form.id==="test-form"){event.preventDefault();submitTest(form)} if(form.id==="result-form"){event.preventDefault();submitResults()} if(form.id==="review-form"){event.preventDefault();submitReview(form)} });
      document.addEventListener("change", event => { if(event.target.id==="title"){ $("#sex").value = event.target.value==="Mr" ? "Male" : "Female"; } });
      document.addEventListener("click", event => {
        const target=event.target.closest("button"); if(!target)return;
        if(target.dataset.user){$("#login-user").value=target.dataset.user;$("#login-password").value=PASSWORD;return}
        if(target.dataset.view){activeView=target.dataset.view;editingTestId=null;render();return}
        if(target.dataset.action==="logout"){session=null;render();return}
        if(target.dataset.action==="edit-test"){editingTestId=target.dataset.id;render();return}
        if(target.dataset.action==="cancel-edit"){editingTestId=null;render();return}
        if(target.dataset.action==="delete-test"){const data=loadData();data.tests=data.tests.filter(test=>test.id!==target.dataset.id);saveData(data);render();toast("Test removed from this location.");return}
        if(target.dataset.action==="view-report"){reportId=target.dataset.id;render();return}
        if(target.dataset.action==="edit-report"){reportId=target.dataset.id;activeView="results";render();return}
        if(target.dataset.action==="print-report"){window.print();return}
      });
      render();
    })();
  </script>
</body>
</html>
