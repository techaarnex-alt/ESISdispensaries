<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESIS Lucknow Laboratory Portal</title>
  <style>
    :root{--navy:#123c53;--navy-dark:#0b2d40;--orange:#d8661d;--orange-soft:#fff0e5;--ink:#263a44;--muted:#708089;--line:#e3e9e7;--bg:#f7f9f8;--green:#16714f;--blue:#28638e}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{display:grid;grid-template-columns:minmax(320px,42%) 1fr;min-height:100vh;background:#fff}.login-brand{display:flex;flex-direction:column;padding:clamp(32px,7vw,78px);color:#fff;background:radial-gradient(circle at 80% 20%,rgba(255,170,77,.27),transparent 27%),linear-gradient(145deg,var(--navy-dark),var(--navy))}.login-brand img{width:104px;height:104px;object-fit:contain;margin:clamp(48px,10vh,110px) 0 26px;border-radius:50%;background:#fff}.eyebrow{margin:0;color:#c85f1d;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.login-brand .eyebrow{color:#ffb169}.login-brand h1{max-width:500px;margin:8px 0;color:#fff;font-size:clamp(2.2rem,4.5vw,4.25rem);letter-spacing:-.06em;line-height:.98}.login-brand h1 em{color:#ffad59;font-family:Georgia,serif;font-weight:400}.login-brand p{max-width:430px;color:#d2e3eb}.login-panel{display:grid;padding:36px;place-items:center}.login-box{width:min(100%,620px)}.login-box h2{margin:10px 0;font-size:2rem;letter-spacing:-.04em}.form{display:grid;gap:15px;margin-top:24px}.field{display:grid;gap:7px;color:#41545e;font-size:.83rem;font-weight:700}.field input,.field select,.field textarea{height:42px;padding:0 11px;color:var(--ink);border:1px solid #dce4e1;border-radius:7px;background:#fff}.field textarea{height:auto;min-height:100px;padding:10px 11px;resize:vertical}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;font-weight:800;border:0;border-radius:7px}.primary{color:#fff;background:var(--navy)}.primary:hover{background:var(--navy-dark)}.secondary{color:#45606d;border:1px solid #d9e1df;background:#fff}.credentials{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.credential{padding:10px;color:var(--ink);text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff}.credential b,.credential small{display:block}.credential b{font-size:.82rem}.credential small{margin-top:2px;color:var(--muted);font-size:.7rem}.app{display:flex;min-height:100vh}.sidebar{display:flex;flex:0 0 254px;flex-direction:column;padding:19px 13px;color:#d5e2e7;background:var(--navy-dark)}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 23px}.brand img{width:39px;height:39px;object-fit:contain;border-radius:50%;background:#fff}.brand strong,.brand span{display:block}.brand strong{color:#fff}.brand span{color:#91b0c0;font-size:.75rem}.location{padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.06)}.location small{display:block;color:#91b0c0;font-size:.66rem;font-weight:800;letter-spacing:.06em}.location b{display:block;margin-top:4px;font-size:.8rem}.nav{display:grid;gap:5px;padding-top:24px}.nav button{padding:10px;color:#b4cbd6;font-weight:700;text-align:left;border:0;border-radius:7px;background:transparent}.nav button.active{color:#fff;background:var(--orange)}.sign-out{margin-top:auto}.main{flex:1;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:17px clamp(22px,4vw,52px);border-bottom:1px solid var(--line);background:#fff}.topbar small{color:var(--muted)}.header-actions{display:flex;align-items:center;gap:13px}.header-date{color:var(--muted);font-size:.78rem}.notification-menu{position:relative}.notification-menu summary{position:relative;display:grid;width:35px;height:35px;color:#4b6270;place-items:center;list-style:none;border:1px solid #dce4e1;border-radius:8px;background:#fff;cursor:pointer}.notification-menu summary::-webkit-details-marker{display:none}.notification-menu summary:after{position:absolute;top:-5px;right:-6px;display:grid;width:17px;height:17px;color:#fff;font-size:.62rem;font-weight:800;place-items:center;border:2px solid #fff;border-radius:50%;background:#c54234;content:'4'}.notification-list{position:absolute;z-index:10;top:45px;right:0;width:min(340px,calc(100vw - 32px));padding:9px 0;margin:0;list-style:none;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 16px 35px rgba(20,46,60,.16)}.notification-list b{display:block;padding:5px 14px 9px;font-size:.82rem;border-bottom:1px solid #edf1ef}.notification-list button{display:grid;grid-template-columns:20px 1fr;gap:8px;width:100%;padding:10px 14px;color:#425660;font-size:.78rem;text-align:left;border:0;background:#fff}.notification-list button:hover{background:#f6f9f8}.notification-dot{font-size:.85rem;line-height:1.2}.avatar{display:grid;width:34px;height:34px;color:var(--navy);font-weight:800;place-items:center;border-radius:50%;background:#e8f0f3}.page{max-width:1360px;padding:clamp(27px,4vw,52px);margin:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:25px}.heading h1{margin:5px 0;font-size:clamp(1.7rem,3vw,2.45rem);letter-spacing:-.05em}.heading p{margin:0;color:var(--muted)}.panel{border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 5px 18px rgba(25,54,66,.04)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:17px;border-bottom:4px solid var(--accent)}.stat strong{display:block;color:var(--accent);font-size:1.65rem}.stat span{color:var(--muted);font-size:.78rem}.orange{--accent:var(--orange)}.green{--accent:var(--green)}.blue{--accent:var(--blue)}.yellow{--accent:#bd8712}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.8fr);gap:18px;margin-top:18px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:1.02rem}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:.78rem}.list{padding:0 20px 13px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ef}.list-row:last-child{border:0}.list-row small{display:block;color:var(--muted)}.status{padding:4px 7px;font-size:.68rem;font-weight:800;border-radius:5px}.collected{color:#2e6585;background:#e8f1f7}.progress{color:#95610d;background:#fff3dc}.completed{color:#14714d;background:#e4f4eb}.notice{padding:20px;color:#4a6675}.booking{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.booking .panel{padding:20px}.booking h2{margin:0}.booking p{color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.full{grid-column:1/-1}.locked{display:flex;align-items:center;min-height:42px;padding:0 11px;color:#61747e;border:1px dashed #bacbc8;border-radius:7px;background:#f8fbfa}.test-group{padding:0 19px}.test-group h3{margin:18px 0 4px;color:#71818a;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}.test-option{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #edf1ef;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.catalogue{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.25fr);gap:18px}.catalogue .panel{padding:20px}.test-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf1ef}.test-item b,.test-item small{display:block}.test-item small{color:var(--muted)}.edit{padding:5px 9px;color:#a85116;font-size:.75rem;font-weight:800;border:0;border-radius:5px;background:var(--orange-soft)}.report{padding:25px}.report h2{margin:0}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:18px;border:1px solid #cfd9d7}.report-grid div{padding:10px;border-right:1px solid #cfd9d7;border-bottom:1px solid #cfd9d7}.report-grid span{display:block;color:var(--muted);font-size:.7rem}.report-grid b{font-size:.85rem}.report-tests{margin-top:18px;border-collapse:collapse;width:100%}.report-tests th,.report-tests td{padding:10px;text-align:left;border:1px solid #dce3e1}.report-tests th{font-size:.72rem;background:#f6f8f7}.review-list{display:grid;gap:12px}.review-card{padding:17px}.review-card b,.review-card small{display:block}.review-card small{margin-top:3px;color:var(--muted)}.stars{color:#d8661d;letter-spacing:2px}.review-card p{margin:9px 0 0;color:#52636b}.empty{padding:28px;color:var(--muted);text-align:center}.toast{position:fixed;right:20px;bottom:20px;padding:11px 14px;color:#fff;font-weight:700;border-radius:7px;background:var(--green);box-shadow:0 8px 20px rgba(0,0,0,.16)}@media(max-width:900px){.login{grid-template-columns:1fr}.login-brand{min-height:auto}.login-brand img{margin:15px 0}.sidebar{display:none}.booking,.catalogue,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.login-panel,.page{padding:22px 16px}.credentials,.fields{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.header-date{display:none}.stats{grid-template-columns:1fr 1fr}.report-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      const branches=[['sarojini','SN','ESIS Dispensary Sarojani Nagar, Lucknow'],['aishbagh','AB','ESIS Dispensary Aishbagh, Lucknow'],['golaganj','GG','ESIS Dispensary Golaganj (KGMU), Lucknow'],['sandeela','SD','ESIS Dispensary Sandeela, Hardoi'],['sitapur','ST','ESIS Dispensary Sitapur'],['barabanki','BB','ESIS Dispensary Barabanki'],['raebareli','RB','ESIS Dispensary Raebareli']].map(([id,short,name])=>({id,short,name}));
      const defaultTests=[['Blood Sugar','Biochemistry','Fasting: 70–100 mg/dL'],['LFT','Biochemistry','As per laboratory reference range'],['CBC','Hematology','Hb: 12–16 g/dL'],['Thyroid Profile','Hormone & electrolyte','As per laboratory reference range']].map(([name,category,reference],id)=>({id:id+1,name,category,reference}));
      const root=document.querySelector('#root'); let branch=null,view='dashboard',editing=null,resultReport=null;
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const key=()=>`esis-static-portal:${branch.id}`; const read=()=>JSON.parse(localStorage.getItem(key())||'{"tests":[],"entries":[],"registration":0}'); const write=d=>localStorage.setItem(key(),JSON.stringify(d));
      const init=()=>{const d=read();if(!d.tests.length)d.tests=defaultTests;if(!Array.isArray(d.reviews))d.reviews=[];if(!Number.isInteger(d.registration))d.registration=d.entries.length;d.entries=d.entries.map(({status:_status,...entry})=>({...entry,tests:(entry.tests||[]).map(test=>({ ...test, result:test.result||'', reference:test.reference||'', note:test.note||'' }))}));write(d);return d}; const show=m=>{document.body.insertAdjacentHTML('beforeend',`<div class="toast">${esc(m)}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2500)};
      function login(){root.innerHTML=`<main class="login"><section class="login-brand"><p class="eyebrow">UTTAR PRADESH ESIS</p><img src="public/up-esis-logo.jpeg" alt="Uttar Pradesh ESIS logo"><h1>Laboratory entries,<br><em>kept private.</em></h1><p>Book tests, enter results, and issue reports separately for every dispensary.</p></section><section class="login-panel"><div class="login-box"><p class="eyebrow">Secure location access</p><h2>Sign in to your dispensary</h2><p>Use the location login ID and password to open that dispensary’s private register.</p><form class="form" id="loginform"><label class="field">Location login ID<input name="user" autocomplete="username" placeholder="e.g. aishbagh"></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password"></label><p id="loginerror" class="hidden" style="margin:0;color:#b23527;font-weight:700"></p><button class="primary">Sign in</button></form><div class="credentials"><p style="grid-column:1/-1;margin:4px 0 0;color:var(--muted);font-size:.78rem">Demo password: <b>ESI@2026</b></p>${branches.map(b=>`<button class="credential" data-login="${b.id}"><b>${b.short} · ${esc(b.id)}</b><small>Sign in to ${esc(b.name.replace('ESIS Dispensary ',''))}</small></button>`).join('')}</div></div></section></main>`;const form=root.querySelector('#loginform'),error=root.querySelector('#loginerror');form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),user=String(data.get('user')||'').trim().toLowerCase(),password=String(data.get('password')||'');branch=branches.find(b=>b.id===user)||null;if(!branch||password!=='ESI@2026'){branch=null;error.textContent='Enter a valid location login ID and password.';error.classList.remove('hidden');return}init();render()};root.querySelectorAll('[data-login]').forEach(button=>button.onclick=()=>{branch=branches.find(b=>b.id===button.dataset.login);init();render()})}
      function shell(content,title){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><img src="public/up-esis-logo.jpeg" alt=""><div><strong>ESIS Lab Portal</strong><span>Lucknow Zone</span></div></div><div class="location"><small>SIGNED IN LOCATION</small><b>${branch.short} · ${esc(branch.name.replace('ESIS Dispensary ',''))}</b></div><nav class="nav">${[['dashboard','Dashboard'],['patients','Patients'],['booking','Test booking'],['results','Result entry'],['reports','Reports'],['tests','Test catalogue'],['reviews','Customer reviews']].map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}">${label}</button>`).join('')}</nav><button class="secondary sign-out" id="signout">Sign out</button></aside><main class="main"><header class="topbar"><small>ESIS Lucknow Zone / <b>${title}</b></small><div class="header-actions"><span class="header-date">08 Sep 2026</span><details class="notification-menu"><summary aria-label="4 notifications">🔔</summary><div class="notification-list"><b>Notifications · 4 need attention</b><button data-view="reports"><span class="notification-dot">🔴</span>Critical result requires verification</button><button data-view="reports"><span class="notification-dot">🟡</span>4 reports pending</button><button data-view="reports"><span class="notification-dot">🟡</span>3 samples delayed</button><button data-view="tests"><span class="notification-dot">⚠️</span>CBC reagent low in stock</button></div></details><span class="avatar">${branch.short}</span></div></header>${content}</main></div>`;root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;editing=null;render()});root.querySelector('#signout').onclick=()=>{branch=null;login()}}
      function dashboard(){const d=init();return `<section class="page"><div class="heading"><div><p class="eyebrow">Today at your location</p><h1>${esc(branch.name.replace('ESIS Dispensary ',''))}</h1><p>Your register is isolated from all other ESIS dispensaries.</p></div><button class="primary" data-view="booking">＋ Test booking</button></div><div class="stats"><div class="panel stat orange"><strong>${d.entries.length}</strong><span>Patient entries</span></div><div class="panel stat green"><strong>${d.entries.reduce((n,e)=>n+e.tests.length,0)}</strong><span>Tests booked</span></div><div class="panel stat blue"><strong>${d.tests.length}</strong><span>Available tests</span></div><div class="panel stat yellow"><strong>${branch.short}</strong><span>Location register</span></div></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Recent test bookings</h2><p>Latest patients at this location</p></div></div><div class="list">${d.entries.length?d.entries.slice(0,5).map(e=>`<div class="list-row"><div><b>${esc(e.patient)}</b><small>${esc(e.registration||'Legacy registration')} · ${esc(e.ip)}</small></div></div>`).join(''):'<div class="empty">No test bookings have been saved yet.</div>'}</div></section><aside class="panel"><div class="panel-head"><div><h2>Result entry</h2><p>Doctor-set reference ranges are saved with each test.</p></div></div><div class="notice"><b>${esc(branch.name)}</b><br>Patient bookings, results, and reports remain private to this signed-in branch.</div></aside></div></section>`}
      function booking(){const d=init(),groups={};d.tests.forEach(t=>(groups[t.category]??=[]).push(t));return `<section class="page"><div class="heading"><div><p class="eyebrow">Patient registration</p><h1>Test booking</h1><p>Book laboratory tests for a patient at <b>${esc(branch.name)}</b>.</p></div></div><form id="booking" class="booking"><section class="panel"><h2>Patient details</h2><p>Enter the IP number supplied by the store employee. A registration number is generated when the patient is saved.</p><div class="fields"><div class="field full"><span>Registration number</span><div class="locked">Automatically generated when this patient is saved</div></div><label class="field">Patient name *<input name="patient" required maxlength="100" placeholder="Enter full name"></label><label class="field">IP number *<input name="ip" required maxlength="60" placeholder="Enter IP number provided by store"></label><label class="field">Age<input name="age" type="number" min="0" max="120" placeholder="Years"></label><label class="field">Sex<select name="sex"><option>Male</option><option>Female</option><option>Other</option></select></label><label class="field">Relationship with IP<select name="relationship"><option>Self</option><option>H/O (Husband of)</option><option>W/O (Wife of)</option><option>S/O (Son of)</option><option>D/O (Daughter of)</option><option>Father</option><option>Mother</option></select></label><label class="field full">Name of IP holder / related person<input name="holder" maxlength="100" placeholder="Enter name, if applicable"></label><label class="field full">Transferred from another dispensary<select name="transfer"><option value="">Not transferred</option>${branches.filter(b=>b.id!==branch.id).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><div class="field full"><span>Dispensary name</span><div class="locked">${esc(branch.name)}</div></div></div><div class="actions"><button type="reset" class="secondary">Clear</button><button class="primary">Save test booking</button></div></section><aside class="panel"><div class="panel-head"><div><h2>Select laboratory tests</h2><p>Choose tests required for this patient.</p></div></div>${Object.entries(groups).map(([category,tests])=>`<div class="test-group"><h3>${esc(category)}</h3>${tests.map(t=>`<label class="test-option"><input type="checkbox" name="tests" value="${t.id}"> ${esc(t.name)}</label>`).join('')}</div>`).join('')}</aside></form></section>`}
      function patients(){const d=init();return `<section class="page"><div class="heading"><div><p class="eyebrow">Patient register</p><h1>Patients</h1><p>Patients registered at <b>${esc(branch.name)}</b>.</p></div></div><section class="panel"><div class="panel-head"><div><h2>Registered patients</h2><p>${d.entries.length} patient${d.entries.length===1?'':'s'} at this location</p></div></div><div class="list">${d.entries.length?d.entries.map(e=>`<div class="list-row"><div><b>${esc(e.patient)}</b><small>${esc(e.registration||'Legacy registration')} · ${esc(e.ip)}</small></div></div>`).join(''):'<div class="empty">No patients have been registered yet.</div>'}</div></section></section>`}
      function tests(){const d=init();return `<section class="page"><div class="heading"><div><p class="eyebrow">Location test catalogue</p><h1>Tests</h1><p>Only ${esc(branch.name)} can view or edit this test catalogue.</p></div></div><div class="catalogue"><section class="panel"><h2>${editing?'Edit laboratory test':'Add a laboratory test'}</h2><p>Create a test available at this dispensary.</p><form class="form" id="testform"><label class="field">Test name *<input name="name" required value="${esc(editing?.name||'')}"></label><label class="field">Category<input name="category" value="${esc(editing?.category||'')}"></label><label class="field">Reference range / notes<input name="reference" value="${esc(editing?.reference||'')}"></label><div class="actions">${editing?'<button type="button" id="cancel" class="secondary">Cancel</button>':''}<button class="primary">${editing?'Save changes':'Add test'}</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>Available at this location</h2><p>Test details can be edited for this dispensary.</p></div><b>${d.tests.length} tests</b></div><div class="list">${d.tests.map(t=>`<div class="test-item"><div><small>${esc(t.category||'General laboratory')}</small><b>${esc(t.name)}</b><small>${esc(t.reference||'')}</small></div><button class="edit" data-edit="${t.id}">Edit</button></div>`).join('')||'<div class="empty">No tests added.</div>'}</div></section></div></section>`}
      function reports(){const d=init();const e=d.entries.find(entry=>entry.report===resultReport)||d.entries[0];return `<section class="page"><div class="heading"><div><p class="eyebrow">Laboratory reports</p><h1>Reports</h1><p>Bookings for ${esc(branch.name)} only.</p></div></div>${e?`<article class="panel report"><p class="eyebrow">${esc(e.report)}</p><h2>${esc(e.patient)}</h2><div class="report-grid"><div><span>REGISTRATION NUMBER</span><b>${esc(e.registration||'Legacy registration')}</b></div><div><span>IP NUMBER</span><b>${esc(e.ip)}</b></div><div><span>IP NAME</span><b>${esc(e.ipName||'—')}</b></div><div><span>REFERRED</span><b>${e.transfer?'Yes':'No'}</b></div><div><span>NAME OF DISPENSARY</span><b>${esc(e.transfer||branch.name)}</b></div></div><table class="report-tests"><thead><tr><th>TEST</th><th>RESULT</th><th>REFERENCE RANGE</th></tr></thead><tbody>${e.tests.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.result||'—')}</td><td>${esc(t.reference||'—')}</td></tr>`).join('')}</tbody></table></article>`:'<div class="panel empty">No reports are available until a test booking is saved.</div>'}</section>`}
      function results(){const d=init(),e=d.entries.find(entry=>entry.report===resultReport)||d.entries[0];return `<section class="page"><div class="heading"><div><p class="eyebrow">Laboratory reporting</p><h1>Result entry</h1><p>Enter the result and doctor-set reference range for each test.</p></div></div>${d.entries.length?`<section class="panel" style="padding:20px"><label class="field" style="max-width:520px">Choose a test entry<select id="resultentry">${d.entries.map(entry=>`<option value="${esc(entry.report)}" ${entry.report===e.report?'selected':''}>${esc(entry.report)} · ${esc(entry.patient)} · ${esc(entry.ip)}</option>`).join('')}</select></label><form class="form" id="resultform">${e.tests.map(test=>`<div class="fields" style="margin-top:8px;padding-top:12px;border-top:1px solid var(--line)"><div class="field full"><b>${esc(test.name)}</b></div><label class="field">Result value<input name="result-${test.id}" value="${esc(test.result||'')}" maxlength="120" placeholder="Enter value"></label><label class="field">Reference range (set by doctor)<input name="reference-${test.id}" value="${esc(test.reference||'')}" maxlength="160" placeholder="e.g. 70–100 mg/dL"></label><label class="field full">Remarks<input name="note-${test.id}" value="${esc(test.note||'')}" maxlength="240" placeholder="Optional note"></label></div>`).join('')}<div class="actions"><button class="primary">Save result entry</button></div></form></section>`:'<div class="panel empty">No test bookings have been saved yet.</div>'}</section>`}
      function reviews(){const d=init();return `<section class="page"><div class="heading"><div><p class="eyebrow">Customer feedback</p><h1>Customer reviews</h1><p>Reviews are stored separately for <b>${esc(branch.name)}</b>.</p></div></div><div class="grid" style="margin-top:0"><section class="panel" style="padding:20px"><h2 style="margin:0">Add a review</h2><p style="color:var(--muted)">Record feedback received at this dispensary.</p><form class="form" id="reviewform"><label class="field">Reviewer name<input name="name" maxlength="80" placeholder="Optional"></label><label class="field">Rating<select name="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Needs improvement</option><option value="1">1 — Poor</option></select></label><label class="field">Review *<textarea name="message" required maxlength="500" placeholder="Write the customer feedback"></textarea></label><div class="actions"><button class="primary">Save review</button></div></form></section><section><div class="panel-head"><div><h2>Reviews from this location</h2><p>${d.reviews.length} saved review${d.reviews.length===1?'':'s'}</p></div></div><div class="review-list">${d.reviews.length?d.reviews.map(r=>`<article class="panel review-card"><b>${esc(r.name||'Anonymous reviewer')}</b><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><small>${new Date(r.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</small><p>${esc(r.message)}</p></article>`).join(''):'<div class="panel empty">No customer reviews have been saved for this dispensary.</div>'}</div></section></div></section>`}
      function render(){const pages={dashboard:[dashboard,'Overview'],patients:[patients,'Patients'],booking:[booking,'Test booking'],tests:[tests,'Test catalogue'],reports:[reports,'Reports'],results:[results,'Result entry'],reviews:[reviews,'Customer reviews']};const [page,title]=pages[view];shell(page(),title);root.querySelector('[data-view="booking"]')?.addEventListener('click',()=>{view='booking';render()});if(view==='booking'){root.querySelector('#booking').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),selected=[...f.getAll('tests')].map(id=>init().tests.find(t=>String(t.id)===id)).filter(Boolean),ip=String(f.get('ip')||'').trim();if(!ip)return show('Enter the IP number provided by the store employee.');if(!selected.length)return show('Select at least one laboratory test.');const d=init(),number=(d.registration||0)+1;d.registration=number;d.entries.unshift({patient:f.get('patient').trim(),registration:`REG-${branch.short}-${String(number).padStart(6,'0')}`,ip,ipName:String(f.get('holder')||'').trim(),report:`LKO-${branch.short}-${Date.now().toString().slice(-8)}`,transfer:branches.find(b=>b.id===f.get('transfer'))?.name||'',tests:selected.map(test=>({...test,result:'',note:''}))});write(d);resultReport=d.entries[0].report;view='reports';show('Patient registered. Registration number assigned automatically.');render()}}if(view==='results'){root.querySelector('#resultentry').onchange=e=>{resultReport=e.target.value;render()};root.querySelector('#resultform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),d=init(),entry=d.entries.find(item=>item.report===resultReport)||d.entries[0];entry.tests=entry.tests.map(test=>({...test,result:String(f.get(`result-${test.id}`)||'').trim(),reference:String(f.get(`reference-${test.id}`)||'').trim(),note:String(f.get(`note-${test.id}`)||'').trim()}));write(d);show('Results and reference ranges were saved.');render()}}if(view==='tests'){root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=init().tests.find(t=>t.id===Number(b.dataset.edit));render()});root.querySelector('#cancel')?.addEventListener('click',()=>{editing=null;render()});root.querySelector('#testform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),d=init(),test={id:editing?.id||Date.now(),name:f.get('name').trim(),category:f.get('category').trim()||'General laboratory',reference:f.get('reference').trim()};if(editing)d.tests=d.tests.map(t=>t.id===editing.id?test:t);else d.tests.push(test);write(d);editing=null;show('Test saved for this location.');render()}}if(view==='reviews'){root.querySelector('#reviewform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),message=String(f.get('message')||'').trim();if(!message)return;const d=init();d.reviews.unshift({name:String(f.get('name')||'').trim(),rating:Number(f.get('rating')),message,createdAt:Date.now()});write(d);show('Customer review saved for this dispensary.');render()}}}
      login();
    })();
  </script>
</body>
</html>
